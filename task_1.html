<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Table</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: "Arial";
            font-size: 20px;
        }

        td {
            border: 1px solid black;
            padding: 5px 10px;
            height: 30px;
            vertical-align: middle;
        }
    </style>

</head>
<body>

<table>
    <tr>
        <td>Name</td>
        <td></td>
        <td>Photo</td>

    </tr>

    <tr>
        <td>Date of birth</td>
        <td colspan="2"></td>
    </tr>

    <tr>
        <td>Religion</td>
        <td colspan="2"></td>
    </tr>

    <tr>
        <td>Race</td>
        <td colspan="2"></td>
    </tr>

    <tr>
        <td rowspan="4">Address</td>
        <td>Street</td>
        <td></td>
    </tr>

    <tr>
        <td>Town</td>
        <td></td>
    </tr>

    <tr>
        <td>District</td>
        <td></td>
    </tr>

    <tr>
        <td>State</td>
        <td></td>
    </tr>

    <tr>
        <td rowspan="3">Contact</td>
        <td>Mobile Phone</td>
        <td></td>
    </tr>

    <tr>
        <td>Social Media</td>
        <td></td>
    </tr>

    <tr>
        <td>Website</td>
        <td></td>
    </tr>

    <tr>
        <td>Course and<br>Institution</td>
        <td colspan="2"></td>
    </tr>

    <tr>
        <td>Programming skills</td>
        <td colspan="2"></td>
    </tr>

    <tr>
        <td>Hobbies</td>
        <td colspan="2"></td>
    </tr>

    <tr>
        <td>2026 Wishlist</td>
        <td colspan="2"></td>
    </tr>
</table>

</body>
</html>
