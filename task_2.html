<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration Form</title>
</head>

<style>
    title {
        font-weight: bold;
        font-size: large;
    }
</style>
<body>

    <h2 class="title">Conference Registration Form</h2>

    <form action="#" method="post">

        <label for="fullname">Full Name:</label><br>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required
        >
        <br>
       
        <label for="email">Email Address:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
        >
        <br>

        <label for="age">Age:</label><br>
        <input
            type="number"
            id="age"
            name="age"
            placeholder="18"
            min="18"
            max="99"
            required
        >
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        <label for="country">Country of Residence:</label><br>
        <select id="country" name="country">
            <option value="Malaysia" selected>Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Japan">Thailand</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <p>Areas of Interest:</p>

        <input type="checkbox" id="software" name="interest"
               value="Software Development">
        <label for="software">Software Development</label><br>

        <input type="checkbox" id="data" name="interest"
               value="Data Science">
        <label for="data">Data Science</label><br>

        <input type="checkbox" id="cybersecurity" name="interest"
               value="Cybersecurity">
        <label for="cybersecurity">Cybersecurity</label><br>

        <input type="checkbox" id="ai" name="interest"
               value="Artificial Intelligence">
        <label for="ai">Artificial Intelligence</label>
        <br><br>

        <p>Experience Level:</p>

        <input type="radio" id="beginner" name="experience"
               value="Beginner">
        <label for="beginner">Beginner</label><br>

        <input type="radio" id="intermediate" name="experience"
               value="Intermediate">
        <label for="intermediate">Intermediate</label><br>

        <input type="radio" id="advanced" name="experience"
               value="Advanced">
        <label for="advanced">Advanced</label>
        <br><br>

        <label for="comments">Comments or Questions:</label><br>
        <textarea
            id="comments"
            name="comments"
            rows="5"
            cols="55"
            placeholder="Any comments or questions?"
        ></textarea>
        <br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>
    </form>

</body>
</html>
